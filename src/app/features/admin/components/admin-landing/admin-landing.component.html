<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-slate-800">Editar Landing Page</h1>
    <button (click)="saveContent()" [disabled]="landingForm.invalid" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 font-medium shadow-sm">
      Guardar Cambios
    </button>
  </div>

  <div class="flex gap-6 items-start">
    <!-- Sidebar / Tabs -->
    <div class="w-64 shrink-0 flex flex-col gap-2 bg-white rounded-xl shadow-sm p-3 border border-slate-200">
      <button (click)="activeTab = 'hero'" [class.bg-blue-50]="activeTab === 'hero'" [class.text-blue-600]="activeTab === 'hero'" [class.text-slate-600]="activeTab !== 'hero'" class="text-left px-4 py-3 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        Hero Section
      </button>
      <button (click)="activeTab = 'about'" [class.bg-blue-50]="activeTab === 'about'" [class.text-blue-600]="activeTab === 'about'" [class.text-slate-600]="activeTab !== 'about'" class="text-left px-4 py-3 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        ¿Qué es P.I.V.E.S.?
      </button>
      <button (click)="activeTab = 'features'" [class.bg-blue-50]="activeTab === 'features'" [class.text-blue-600]="activeTab === 'features'" [class.text-slate-600]="activeTab !== 'features'" class="text-left px-4 py-3 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        ¿Qué ofrece?
      </button>
      <button (click)="activeTab = 'institutions'" [class.bg-blue-50]="activeTab === 'institutions'" [class.text-blue-600]="activeTab === 'institutions'" [class.text-slate-600]="activeTab !== 'institutions'" class="text-left px-4 py-3 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        Instituciones
      </button>
      <button (click)="activeTab = 'businesses'" [class.bg-blue-50]="activeTab === 'businesses'" [class.text-blue-600]="activeTab === 'businesses'" [class.text-slate-600]="activeTab !== 'businesses'" class="text-left px-4 py-3 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        Comercios
      </button>
      <button (click)="activeTab = 'sponsors'" [class.bg-blue-50]="activeTab === 'sponsors'" [class.text-blue-600]="activeTab === 'sponsors'" [class.text-slate-600]="activeTab !== 'sponsors'" class="text-left px-4 py-3 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        Auspiciantes
      </button>
      <button (click)="activeTab = 'steps'" [class.bg-blue-50]="activeTab === 'steps'" [class.text-blue-600]="activeTab === 'steps'" [class.text-slate-600]="activeTab !== 'steps'" class="text-left px-4 py-3 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        Cómo Empezar
      </button>
      <button (click)="activeTab = 'cta'" [class.bg-blue-50]="activeTab === 'cta'" [class.text-blue-600]="activeTab === 'cta'" [class.text-slate-600]="activeTab !== 'cta'" class="text-left px-4 py-3 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        Call To Action
      </button>
    </div>

    <!-- Form Content -->
    <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 p-6" *ngIf="landingForm">
      <form [formGroup]="landingForm" class="flex flex-col gap-4">
        
        <!-- Hero Tab -->
        <ng-container *ngIf="activeTab === 'hero'" formGroupName="hero">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Hero Section</h2>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Insignia (Badge)</label><input type="text" formControlName="badge" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Título Parte 1</label><input type="text" formControlName="title1" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Título Parte 2 (Resaltado)</label><input type="text" formControlName="title2" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="description" rows="4" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Botón Principal</label><input type="text" formControlName="btn1" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Botón Secundario</label><input type="text" formControlName="btn2" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
        </ng-container>

        <!-- About Tab -->
        <ng-container *ngIf="activeTab === 'about'" formGroupName="about">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">¿Qué es P.I.V.E.S.?</h2>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Insignia (Badge)</label><input type="text" formControlName="badge" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="description" rows="3" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
          
          <div class="grid grid-cols-2 gap-4 mt-4 bg-slate-50 p-4 rounded-lg">
            <h3 class="col-span-2 font-bold text-slate-700">Tarjeta: Misión</h3>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="missionTitle" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="missionDesc" rows="2" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
          </div>
          <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg">
            <h3 class="col-span-2 font-bold text-slate-700">Tarjeta: Visión</h3>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="visionTitle" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="visionDesc" rows="2" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
          </div>
          <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg">
            <h3 class="col-span-2 font-bold text-slate-700">Tarjeta: Método</h3>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="methodTitle" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="methodDesc" rows="2" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
          </div>
        </ng-container>

        <!-- Features Tab -->
        <ng-container *ngIf="activeTab === 'features'" formGroupName="features">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">¿Qué ofrece?</h2>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Insignia (Badge)</label><input type="text" formControlName="badge" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div class="mb-4"><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          
          <h3 class="font-bold text-slate-700 mt-2 mb-2">Características (Tarjetas)</h3>
          <div formArrayName="items" class="space-y-4">
            <div *ngFor="let item of featuresItems.controls; let i = index" [formGroupName]="i" class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-100">
              <div class="md:col-span-1">
                <label class="block text-sm font-medium text-slate-700 mb-1">Título {{i + 1}}</label>
                <input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Descripción {{i + 1}}</label>
                <textarea formControlName="description" rows="2" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- Institutions Tab -->
        <ng-container *ngIf="activeTab === 'institutions'" formGroupName="institutions">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Instituciones</h2>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Insignia (Badge)</label><input type="text" formControlName="badge" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="description" rows="3" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
        </ng-container>

        <!-- Businesses Tab -->
        <ng-container *ngIf="activeTab === 'businesses'" formGroupName="businesses">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Comercios</h2>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Insignia (Badge)</label><input type="text" formControlName="badge" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="description" rows="3" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
        </ng-container>

        <!-- Sponsors Tab -->
        <ng-container *ngIf="activeTab === 'sponsors'" formGroupName="sponsors">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Auspiciantes</h2>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Insignia (Badge)</label><input type="text" formControlName="badge" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="description" rows="3" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
        </ng-container>

        <!-- Steps Tab -->
        <ng-container *ngIf="activeTab === 'steps'" formGroupName="steps">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Cómo Empezar</h2>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Insignia (Badge)</label><input type="text" formControlName="badge" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div class="mb-4"><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          
          <h3 class="font-bold text-slate-700 mt-2 mb-2">Pasos</h3>
          <div formArrayName="items" class="space-y-4">
            <div *ngFor="let item of stepsItems.controls; let i = index" [formGroupName]="i" class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-100">
              <div class="md:col-span-1">
                <label class="block text-sm font-medium text-slate-700 mb-1">Paso {{i + 1}}</label>
                <input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Descripción {{i + 1}}</label>
                <textarea formControlName="description" rows="2" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- CTA Tab -->
        <ng-container *ngIf="activeTab === 'cta'" formGroupName="cta">
          <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Call To Action Final</h2>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Título</label><input type="text" formControlName="title" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label><textarea formControlName="description" rows="3" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Texto del Botón</label><input type="text" formControlName="btn" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></div>
        </ng-container>

      </form>
    </div>
  </div>
</div>
